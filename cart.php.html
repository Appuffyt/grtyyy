            border-radius: 50%; text-decoration: none; transition: all 0.3s;

        .back-btn:hover { background: #e2e8f0; color: #ff416c; }
        
        .page-title { font-weight: 800; font-size: 1.2rem; color: #2d3748; letter-spacing: 0.5px; }

        .item-card { 
            background: #fff; border-radius: 20px; padding: 15px;

        .item-size { font-size: 0.8rem; font-weight: 600; color: #718096; margin-bottom: 4px; }
        .item-price { font-weight: 800; font-size: 1.05rem; color: #1a202c; }

        /* Sleek Quantity Pill */
        .qty-pill {

            border-radius: 50%; font-size: 14px; font-weight: 800; color: #4a5568; 
            box-shadow: 0 2px 6px rgba(0,0,0,0.05); transition: 0.3s; display: flex; align-items: center; justify-content: center;

        .qty-btn:hover { color: #ff416c; background: #fff; transform: scale(1.05); }
        .qty-text { font-weight: 700; font-size: 0.9rem; color: #2d3748; min-width: 15px; text-align: center; }

        /* Premium Trash Button */
        .btn-remove { 
            background: #fff5f5; color: #fc8181; width: 35px; height: 35px; 
            border-radius: 10px; display: flex; align-items: center; justify-content: center; 
            text-decoration: none; font-size: 1rem; transition: 0.3s;
            position: absolute; right: 15px; top: 15px;
        }
        .btn-remove:hover { background: #fed7d7; color: #e53e3e; }

        /* Voucher/Coupon Box */
        .voucher-box { 
            background: #fff; padding: 20px; border-radius: 20px; 
            margin: 25px 0; box-shadow: 0 8px 20px rgba(0,0,0,0.02); border: 1px dashed #cbd5e0;
        }
        .voucher-input {
            border-radius: 12px; border: 1px solid #e2e8f0; background: #f8fafc;
            padding: 12px 15px; font-weight: 600; font-size: 0.95rem; text-transform: uppercase;
        }
        .voucher-input:focus { border-color: #ff416c; box-shadow: none; outline: none; }
        
        .apply-btn { 
            background: #2d3748; color: #fff; border: none; padding: 0 25px; 
            border-radius: 12px; font-weight: 700; letter-spacing: 0.5px; transition: 0.3s;
        }
        .apply-btn:hover { background: #ff416c; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255,65,108,0.2); }

        /* Payment Summary Card */
        .payment-card { 
            background: #fff; border-radius: 24px; padding: 25px; 
            margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid #f0f4f8;
        }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 0.95rem; color: #718096; }
        .summary-row.discount { color: #38a169; font-weight: 600; }
        .divider { border-top: 2px dashed #e2e8f0; margin: 15px 0; }
        
        /* Grand Total & Checkout */
        .grand-total { font-size: 1.3rem; font-weight: 800; color: #1a202c; }
        .grand-price { font-size: 1.5rem; font-weight: 800; color: #ff416c; }
        
        .btn-checkout { 
            background: linear-gradient(135deg, #ff416c, #ff4b2b); 
            color: #fff !important; border: none; width: 100%; 
            padding: 16px; border-radius: 16px; font-weight: 700; font-size: 1.1rem; 
            text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px;
            box-shadow: 0 8px 25px rgba(255, 65, 108, 0.3); transition: all 0.3s; margin-top: 20px;
        }
        .btn-checkout:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(255, 65, 108, 0.4); }

        /* Empty Cart State */
        .empty-cart-wrapper { text-align: center; padding: 60px 20px; }
        .empty-cart-icon { font-size: 5rem; color: #e2e8f0; margin-bottom: 20px; }
        .btn-shop-now {
            background: #2d3748; color: #fff; padding: 14px 40px; border-radius: 50px; 
            font-weight: 700; text-decoration: none; display: inline-block; transition: 0.3s;
        }
        .btn-shop-now:hover { background: #ff416c; color:#fff; box-shadow: 0 8px 20px rgba(255,65,108,0.2); transform: translateY(-2px); }

<body>

<div class="cart-nav">

    <h5 class="m-0 page-title">Shopping Cart</h5>

</div>

<div class="container mt-3" style="max-width: 550px;">
            <div class="empty-cart-wrapper">
            <i class="fas fa-shopping-cart empty-cart-icon"></i>
            <h4 class="fw-bold text-dark mb-2">Your cart is empty!</h4>
            <p class="text-muted mb-4 small">Looks like you haven't added anything to your cart yet.</p>
            <a href="index.php.html" class="btn-shop-now">START SHOPPING</a>
        </div>
    </div>

<script>
function updateQty(id, change) {
    let input = document.getElementById('qty-' + id);
    let newVal = parseInt(input.value) + change;
    if(newVal < 1) newVal = 1;
    input.value = newVal;
    document.getElementById('cartForm').submit();
}
</script>
</body>

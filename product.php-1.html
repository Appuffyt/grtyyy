<script>
// --- Description Show More Logic ---
document.addEventListener("DOMContentLoaded", function() {
    let desc = document.getElementById("prodDesc");
    let btn = document.getElementById("showMoreBtn");
    // If text exceeds 4 lines (approx 90px height), show button
    if(desc.scrollHeight > desc.clientHeight) {
        btn.style.display = "inline-block";
    }
});

function toggleDesc() {
    let desc = document.getElementById("prodDesc");
    let btn = document.getElementById("showMoreBtn");
    desc.classList.toggle("expanded");
    if(desc.classList.contains("expanded")) {
        btn.innerHTML = "- Show Less";
    } else {
        btn.innerHTML = "+ Show More";
    }
}

// --- Cart Logic Updates (Captures Size if exists) ---
function getSelectedSize() {
    let sizeInput = document.querySelector('input[name="selected_size"]:checked');
    return sizeInput ? sizeInput.value : '';
}

function setFormSize() {
    document.getElementById('hiddenSizeInput').value = getSelectedSize();
}

function addAjax(pid) {
    let fd = new FormData(); 
    fd.append('product_id', pid); 
    fd.append('action', 'add'); 
    fd.append('ajax', '1');
    fd.append('size', getSelectedSize()); // Size attached to form data
    
    fetch('cart.php', { method: 'POST', body: fd })
    .then(r => r.text())
    .then(res => {
        if(res.includes("added")) {
            let t = document.getElementById('cart-toast'); 
            t.classList.add('show'); 
            setTimeout(() => { t.classList.remove('show'); }, 2500);
        }
    });
}
</script>
